# ~/.config/kitty/kitty-macos.conf
# macOS-specific Kitty overrides (loaded automatically via `globinclude kitty-${KITTY_OS}.conf`)

hide_window_decorations titlebar-and-corners
placement_strategy top-left
resize_debounce_time 0.0 0.0

allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

macos_option_as_alt left
macos_traditional_fullscreen yes
macos_show_window_title_in window

# Pass Alt+h/j/k/l (including Right Option on EurKEY where Option+k produces U+0133 'ĳ' and Option+j produces 'ú')
# cleanly to tmux/ssh as ESC+key!
map alt+h send_text all \x1bh
map alt+j send_text all \x1bj
map alt+ú send_text all \x1bj
map ú send_text all \x1bj
map alt+k send_text all \x1bk
map alt+ĳ send_text all \x1bk
map ĳ send_text all \x1bk
map alt+l send_text all \x1bl

# Override macOS Cmd+Q so it only closes the focused OS window instead of nuking ALL single-instance Kitty windows!
map cmd+q close_os_window

# Override Kitty's built-in macOS `cmd+m` (minimize_macos_window), `cmd+k` (clear_terminal), `cmd+h`, `cmd+l`, etc.
# so physical Alt+M / Alt+J / Alt+K / Alt+H / Alt+L on Windows-mode keyboard send clean Alt (ESC+key) to CLI apps & tmux!
map cmd+m send_text all \x1bm
map opt+cmd+m send_text all \x1bm
map alt+m send_text all \x1bm
map alt+Ω send_text all \x1bm
map Ω send_text all \x1bm
map cmd+h send_text all \x1bh
map cmd+j send_text all \x1bj
map cmd+k send_text all \x1bk
map opt+cmd+k send_text all \x1bk
map cmd+l send_text all \x1bl

# Resize font only in the currently focused OS window (instead of all single-instance windows)
map cmd+plus        change_font_size current +2.0
map cmd+equal       change_font_size current +2.0
map shift+cmd+equal change_font_size current +2.0
map cmd+minus       change_font_size current -2.0
map shift+cmd+minus change_font_size current -2.0
map cmd+0           change_font_size current 0
