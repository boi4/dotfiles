set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-kitty:RGB"

# Enable DCS passthrough (required for Kitty clipboard kitten & iTerm2 uploads inside tmux)
set -g allow-passthrough on
set -s set-clipboard on

# Propagate local display variables into tmux, and prevent SSH_* from poisoning
# local clipboard detection when attaching over SSH.
set -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID WINDOWID XAUTHORITY WAYLAND_DISPLAY XDG_SESSION_TYPE"
set-environment -gu SSH_CLIENT
set-environment -gu SSH_TTY
set-environment -gu SSH_CONNECTION

# Fast window switching without prefix (Alt+j for next window, Alt+k for previous window)
bind-key -n M-j next-window
bind-key -n M-k previous-window

# Status bar styling
set -g status-style "bg=colour235,fg=colour245"
set -g window-status-separator " "
set -g status-left-length 20
set -g status-right-length 50
set -g status-left "#[bg=colour61]#[fg=colour255]#[bold] #S #[default] "
set -g status-right "#[fg=colour244]%H:%M #[bg=colour238]#[fg=colour250] #h "

# Smart title:
# - If window was explicitly named (automatic-rename == 0, e.g. `Prefix + ,` or `new-window -n`),
#   keep #W and prefix any live status icon when present in pane_title.
# - Otherwise, use pane_title unless empty or default hostname (#H/#h), falling back to `command: dir`.
set -g @smart_pane_fallback '#{pane_current_command}: #{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}}'
set -g @smart_status_prefix '#{?#{m:*🔔*,#{pane_title}},🔔️ ,#{?#{m:*❌*,#{pane_title}},❌️ ,#{?#{m:*⏳*,#{pane_title}},⏳️ ,#{?#{m:*✅*,#{pane_title}},✅️ ,}}}}'
set -g @smart_window_title '#{?#{==:#{automatic-rename},0},#{E:@smart_status_prefix}#W,#{?#{||:#{==:#{pane_title},},#{||:#{==:#{pane_title},#H},#{==:#{pane_title},#h}}},#{E:@smart_pane_fallback},#{pane_title}}}'

# Propagate active window/pane status title to outer terminal (Kitty tab bar)
set -g set-titles on
set -g set-titles-string '#{E:@smart_window_title}'

# Inactive window format (amber/orange if Needs Input / bell, red if Error, else dark gray pill)
set-window-option -g window-status-format '#{?#{||:#{window_bell_flag},#{||:#{m:*🔔*,#{pane_title}},#{m:*Needs Input*,#{pane_title}}}},#[bg=colour208]#[fg=colour16]#[bold],#{?#{m:*❌*,#{pane_title}},#[bg=colour160]#[fg=colour255]#[bold],#[bg=colour238]#[fg=colour250]}} #I: #{E:@smart_window_title}#{?#{==:#{window_zoomed_flag},1}, 🔍,} #[default]'

# Active window format (amber/orange if Needs Input, red if Error, else sky-blue pill)
set-window-option -g window-status-current-format '#{?#{||:#{window_bell_flag},#{||:#{m:*🔔*,#{pane_title}},#{m:*Needs Input*,#{pane_title}}}},#[bg=colour208]#[fg=colour16]#[bold],#{?#{m:*❌*,#{pane_title}},#[bg=colour160]#[fg=colour255]#[bold],#[bg=colour39]#[fg=colour234]#[bold]}} #I: #{E:@smart_window_title}#{?#{==:#{window_zoomed_flag},1}, 🔍,} #[default]'

# Mac EurKEY Right-Option+k (ĳ) and Right-Option+j (ú) fallback
bind-key -n ú next-window
bind-key -n ĳ previous-window
bind-key -n ∆ next-window
bind-key -n ˚ previous-window

# Load optional modular overrides (e.g. ~/.config/tmux/*.conf) if present
source-file -q ~/.config/tmux/*.conf
