set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-kitty:RGB"

# Status bar styling
set -g status-style "bg=colour235,fg=colour245"
set -g window-status-separator " "
set -g status-left-length 20
set -g status-right-length 50
set -g status-left "#[bg=colour61]#[fg=colour255]#[bold] #S #[default] "
set -g status-right "#[fg=colour244]%H:%M #[bg=colour238]#[fg=colour250] #h "

# Smart title: if pane_title is default hostname (#H or #h), fallback to command: directory
# Inactive window format (highlights in amber/orange if Needs Input / alert, else dark gray pill)
set-window-option -g window-status-format '#{?#{||:#{window_bell_flag},#{||:#{m:*🔔*,#{pane_title}},#{m:*Needs Input*,#{pane_title}}}},#[bg=colour208]#[fg=colour16]#[bold],#[bg=colour238]#[fg=colour250]} #I: #{?#{||:#{==:#{pane_title},#H},#{==:#{pane_title},#h}},#{pane_current_command}: #{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}},#{pane_title}}#{?#{==:#{window_zoomed_flag},1}, 🔍,} #[default]'

# Active window format (highlights in amber/orange if Needs Input, else sky-blue pill)
set-window-option -g window-status-current-format '#{?#{||:#{window_bell_flag},#{||:#{m:*🔔*,#{pane_title}},#{m:*Needs Input*,#{pane_title}}}},#[bg=colour208]#[fg=colour16]#[bold],#[bg=colour39]#[fg=colour234]#[bold]} #I: #{?#{||:#{==:#{pane_title},#H},#{==:#{pane_title},#h}},#{pane_current_command}: #{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}},#{pane_title}}#{?#{==:#{window_zoomed_flag},1}, 🔍,} #[default]'
